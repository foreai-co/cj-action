spec:
  inputs:
    service_account_key:
      description: "Your Critical Journey service account key. Store this as a CI/CD variable."
    test_id:
      default: ""
      description: "ID of a single test to run. Either this or test_suite_id must be provided."
    test_suite_id:
      default: ""
      description: "ID of a test suite to run."
    wait_timeout_seconds:
      default: "300"
      description: "Max seconds to wait for results (30–900)."
    website_url_override:
      default: ""
      description: "Override the base website URL used during test execution."
    variable_overrides:
      default: ""
      description: "JSON string of variable overrides, keyed by variable definition ID, e.g. '{\"0b5f...\": {\"kind\": \"non_secret\", \"value\": \"abc\"}}'."
    browser_type_override:
      default: ""
      description: "Browser engine: chromium, firefox, or webkit. Defaults to chromium."
    app_file_path:
      default: ""
      description: "Path to a mobile app to upload before running: an .apk, an .ipa or a .zip holding an iOS simulator build. If test_id or test_suite_id is set, the tests run on the uploaded file unless an app override is set."
    app_name:
      default: ""
      description: "Name of the app to upload the file to. Defaults to the app with the same package or bundle ID, or a new app named after it."
    app_tags:
      default: ""
      description: "Tags of the app to point at the uploaded file, separated by commas, e.g. 'latest, 1.4.3'."
    app_file_id_override:
      default: ""
      description: "ID of the app file to run the tests on instead of their own app."
    app_name_override:
      default: ""
      description: "Name of the app to run the tests on instead of their own app. Needs app_platform_override."
    app_platform_override:
      default: ""
      description: "Platform of the app set in app_name_override: android or ios."
    app_tag_override:
      default: ""
      description: "Tag of the app set in app_name_override whose file to run the tests on. Defaults to latest."
    create_issue_on_failure:
      default: "false"
      description: "Set to 'true' to automatically create a GitLab issue on failure. Requires GITLAB_TOKEN CI/CD variable."
    fail_on_skipped:
      default: "false"
      description: "Set to 'true' to fail when any test in the run was skipped."
    fail_on_not_runnable:
      default: "true"
      description: "Set to 'true' to fail when any test could not be run, e.g. because it is still generating."
    backend_url_override:
      default: ""
      description: "Override the Critical Journey backend URL. Leave empty; for internal use only."
    app_url_override:
      default: ""
      description: "Override the Critical Journey app URL used in result links. Must match backend_url_override. Leave empty; for internal use only."

---

critical-journey:
  image: registry.gitlab.com/foreai-co/cj-action:latest
  variables:
    INPUT_SERVICE_ACCOUNT_KEY: $[[ inputs.service_account_key ]]
    INPUT_TEST_ID: $[[ inputs.test_id ]]
    INPUT_TEST_SUITE_ID: $[[ inputs.test_suite_id ]]
    INPUT_WAIT_TIMEOUT_SECONDS: $[[ inputs.wait_timeout_seconds ]]
    INPUT_WEBSITE_URL_OVERRIDE: $[[ inputs.website_url_override ]]
    INPUT_VARIABLE_OVERRIDES: $[[ inputs.variable_overrides ]]
    INPUT_BROWSER_TYPE_OVERRIDE: $[[ inputs.browser_type_override ]]
    INPUT_APP_FILE_PATH: $[[ inputs.app_file_path ]]
    INPUT_APP_NAME: $[[ inputs.app_name ]]
    INPUT_APP_TAGS: $[[ inputs.app_tags ]]
    INPUT_APP_FILE_ID_OVERRIDE: $[[ inputs.app_file_id_override ]]
    INPUT_APP_NAME_OVERRIDE: $[[ inputs.app_name_override ]]
    INPUT_APP_PLATFORM_OVERRIDE: $[[ inputs.app_platform_override ]]
    INPUT_APP_TAG_OVERRIDE: $[[ inputs.app_tag_override ]]
    INPUT_CREATE_ISSUE_ON_FAILURE: $[[ inputs.create_issue_on_failure ]]
    INPUT_FAIL_ON_SKIPPED: $[[ inputs.fail_on_skipped ]]
    INPUT_FAIL_ON_NOT_RUNNABLE: $[[ inputs.fail_on_not_runnable ]]
    INPUT_BACKEND_URL_OVERRIDE: $[[ inputs.backend_url_override ]]
    INPUT_APP_URL_OVERRIDE: $[[ inputs.app_url_override ]]
    INPUT_GITLAB_TOKEN: $GITLAB_TOKEN
    INPUT_GITLAB_PROJECT_ID: $CI_PROJECT_ID
  script:
    - echo "Critical Journey test started"
