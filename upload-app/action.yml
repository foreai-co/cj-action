name: 'Critical Journey Upload App'
description: 'A GitHub Action to upload a mobile app to Critical Journey'
author: 'foreai-co'

inputs:
  service_account_key:
    description: 'Key to the service account that will upload the app.'
    required: true
    default: ''

  app_file_path:
    description: >-
      Path to the app to upload: an .apk, an .ipa or a .zip holding an iOS simulator build.
      Relative paths are relative to the workspace.
    required: true
    default: ''

  app_name:
    description: >-
      Name of the app to upload the file to. Defaults to the app with the same package or
      bundle ID, or a new app named after it.
    required: false
    default: ''

  app_tags:
    description: >-
      Tags of the app to point at the uploaded file, separated by commas, e.g. "latest, 1.4.3".
      Defaults to latest. Setting tags replaces the default, so list latest too to keep moving it.
    required: false
    default: 'latest'

  organization_id:
    description: >-
      ID of the organization to upload the app to. Needed only if the service account
      belongs to more than one.
    required: false
    default: ''

  backend_url_override:
    description: 'Override the Critical Journey backend URL. Leave empty; for internal use only.'
    required: false
    default: ''


outputs:
  app_file_id:
    description: 'ID of the uploaded app file, e.g. for the app_file_id_override of the Critical Journey action.'
  result:
    description: 'A message that includes information about the upload.'

runs:
  using: 'docker'
  # The image of the Critical Journey action, run with another entry point.
  image: '../Dockerfile'
  entrypoint: 'python'
  args:
    - '/app/upload_app.py'

branding:
  icon: 'upload-cloud'
  color: 'blue'
