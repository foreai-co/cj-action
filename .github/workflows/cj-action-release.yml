name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: ''
      push_to_docker_hub:
        description: 'Whether to push to Docker Hub'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create and Push Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Version
        id: validate_version
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format. Use 'v<major>.<minor>.<patch>' (e.g., v1.0.0)."
            exit 1
          else
            echo "Creating release for version: ${{ github.event.inputs.version }}"
          fi

      - name: Check if the version is already released
        id: check_release
        run: |
          if git tag -l | grep -q ${{ github.event.inputs.version }}; then
            echo "Error: Version ${{ github.event.inputs.version }} has already been released."
            exit 1
          fi

      - name: Run unit tests
        run: |
          python -m pip install pytest requests
          python -m pytest runner_test.py

      - name: Create and Push Tag
        id: create_tag
        run: |
          # Create the Git tag
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          body: |
            This release was manually triggered using GitHub Actions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-docker-hub:
    name: Build and Push to DockerHub
    needs: create-release
    if: ${{ github.event.inputs.push_to_docker_hub == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            foreai/cj-action:${{ github.event.inputs.version }}
            foreai/cj-action:latest
