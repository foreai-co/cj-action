name: 'Critical Journey'
description: 'A GitHub Action to run a Critical Journey UI test'
author: 'foreai-co'

inputs:
  test_id:
    description: 'ID of the test to be run.'
    required: false
    default: ''
  
  test_suite_id:
    description: 'ID of the test suite to be run.'
    required: false
    default: ''
  
  service_account_key:
    description: 'Key to the service account that will run the test.'
    required: true
    default: ''

  wait_timeout_seconds:
    description: 'Maximum number of seconds to wait for the test to complete.'
    required: false
    default: '300'

  website_url_override:
    description: 'Override the website URL for the test.'
    required: false
    default: ''
  
  variable_overrides:
    description: >-
      Override test suite variables for this run. Must be a valid JSON string mapping
      each variable definition ID to an override, e.g.
      '{"0b5f...": {"kind": "non_secret", "value": "abc"}}'.
    required: false
    default: ''

  browser_type_override:
    description: 'Browser type to use for the test: chromium, firefox, or webkit. Defaults to chromium'
    required: false
    default: ''

  app_file_path:
    description: >-
      Path to a mobile app to upload before running: an .apk, an .ipa or a .zip holding an
      iOS simulator build. Relative paths are relative to the workspace. If test_id or
      test_suite_id is set, the tests run on the uploaded file unless an app override is set.
    required: false
    default: ''

  app_name:
    description: >-
      Name of the app to upload the file to. Defaults to the app with the same package or
      bundle ID, or a new app named after it.
    required: false
    default: ''

  app_tags:
    description: >-
      Tags of the app to point at the uploaded file, separated by commas, e.g. "latest, 1.4.3".
      Defaults to latest. Setting tags replaces the default, so list latest too to keep moving it.
    required: false
    default: 'latest'

  app_file_id_override:
    description: 'ID of the app file to run the tests on instead of their own app.'
    required: false
    default: ''

  app_name_override:
    description: 'Name of the app to run the tests on instead of their own app. Needs app_platform_override.'
    required: false
    default: ''

  app_platform_override:
    description: 'Platform of the app set in app_name_override: android or ios.'
    required: false
    default: ''

  app_tag_override:
    description: 'Tag of the app set in app_name_override whose file to run the tests on. Defaults to latest.'
    required: false
    default: ''

  create_issue_on_failure:
    description: 'If true, creates a GitHub issue when the test run fails.'
    required: false
    default: 'false'

  fail_on_skipped:
    description: 'If true, the action fails when any test in the run was skipped.'
    required: false
    default: 'false'

  fail_on_not_runnable:
    description: 'If true, the action fails when any test could not be run, e.g. because it is still generating.'
    required: false
    default: 'true'

  backend_url_override:
    description: 'Override the Critical Journey backend URL. Leave empty; for internal use only.'
    required: false
    default: ''

  app_url_override:
    description: 'Override the Critical Journey app URL used in result links. Must match backend_url_override. Leave empty; for internal use only.'
    required: false
    default: ''


outputs:
  result:
    description: 'A message that includes information about the status of the run.'
  app_file_id:
    description: 'ID of the app file uploaded from app_file_path, if any.'

runs:
  using: 'docker'
  image: 'Dockerfile'

branding:
  icon: 'cloud-lightning'
  color: 'blue'
