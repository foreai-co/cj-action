name: 'Critical Journey'
description: 'A GitHub Action to run a Critical Journey UI test'
author: 'foreai-co'

inputs:
  test_id:
    description: 'ID of the test to be run.'
    required: false
    default: ''
  
  test_suite_id:
    description: 'ID of the test suite to be run.'
    required: false
    default: ''
  
  service_account_key:
    description: 'Key to the service account that will run the test.'
    required: true
    default: ''

  wait_timeout_seconds:
    description: 'Maximum number of seconds to wait for the test to complete.'
    required: false
    default: '300'

  website_url_override:
    description: 'Override the website URL for the test.'
    required: false
    default: ''
  
  variable_overrides:
    description: >-
      Override test suite variables for this run. Must be a valid JSON string mapping
      each variable definition ID to an override, e.g.
      '{"0b5f...": {"kind": "non_secret", "value": "abc"}}'.
    required: false
    default: ''

  browser_type_override:
    description: 'Browser type to use for the test: chromium, firefox, or webkit. Defaults to chromium'
    required: false
    default: ''

  create_issue_on_failure:
    description: 'If true, creates a GitHub issue when the test run fails.'
    required: false
    default: 'false'

  backend_url_override:
    description: 'Override the Critical Journey backend URL. Leave empty; for internal use only.'
    required: false
    default: ''

  app_url_override:
    description: 'Override the Critical Journey app URL used in result links. Must match backend_url_override. Leave empty; for internal use only.'
    required: false
    default: ''


outputs:
  result:
    description: 'A message that includes information about the status of the run.'

runs:
  using: 'docker'
  image: 'Dockerfile'

branding:
  icon: 'cloud-lightning'
  color: 'blue'
